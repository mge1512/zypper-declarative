[package]
name = "zypper-declarative"
version = "0.6.3"
edition = "2021"
description = "Declarative, reconciling converger for SUSE systems, surfaced as a zypper subcommand"
license = "GPL-2.0-or-later"
repository = "github.com/mge1512/zypper-declarative"
authors = ["Matthias G. Eckermann <pcd@mailbox.org>"]

[[bin]]
name = "zypper-declarative"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
libc = "0.2"

[profile.release]
strip = true
