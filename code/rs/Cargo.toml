# pcd-spec-sha256: 51284526723dc9238113984023bfb9a596d55b534c8ea580dfac1157cd70dd03
[package]
name = "zypper-declarative"
version = "0.6.6"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Declarative convergence of SUSE system state (packages, repositories, services, /etc config files) inside a snapshot transaction."
authors = ["Matthias G. Eckermann <pcd@mailbox.org>"]
repository = "https://github.com/mge1512/zypper-declarative"
build = "build.rs"

[[bin]]
name = "zypper-declarative"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"

[profile.release]
strip = true
