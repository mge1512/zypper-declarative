#
# Black-box integration test crate for the zypper-declarative CLI binary.
# These tests invoke the built binary via std::process::Command at the
# canonical project-root location (../../zypper-declarative relative to this
# directory) and assert on stdout, stderr, and exit code only. They never link
# against or call into the implementation's internal functions.

[package]
name = "zypper-declarative-blackbox-tests"
version = "0.6.3"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"

# Integration tests live in tests/ and are discovered automatically by cargo;
# `cargo test --test '*'` runs every file in tests/ as its own test binary.
